<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="910" viewBox="0 0 1400 910" role="img" aria-labelledby="title"><title id="title">Qualifying retinal model sets and gene consensus</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#456c99"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#182735"><text x="40" y="58" font-size="34" font-weight="700">Two phenotype tasks, separate qualifying model sets</text><text x="40" y="100" font-size="24" >Schematic of models reported above the study’s held-out R² = 0.90 threshold</text><rect x="40" y="155" width="610" height="230" rx="12" fill="#f2f6fb" stroke="#bacbdc" stroke-width="2"/><text x="62" y="195" font-size="26" font-weight="700">4-HNE: oxidative-damage phenotype</text><text x="62" y="235" font-size="22" >Linear regression</text><text x="62" y="269" font-size="22" >Lasso regression</text><text x="62" y="303" font-size="22" >Ridge regression</text><rect x="750" y="155" width="610" height="230" rx="12" fill="#f2f6fb" stroke="#bacbdc" stroke-width="2"/><text x="772" y="195" font-size="26" font-weight="700">TUNEL: apoptosis-associated phenotype</text><text x="772" y="235" font-size="22" >Linear regression</text><text x="772" y="269" font-size="22" >Elastic Net regression</text><text x="772" y="303" font-size="22" >Support Vector Regression</text><path d="M345 385V440" stroke="#456c99" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1055 385V440" stroke="#456c99" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="40" y="455" width="610" height="150" rx="12" fill="#f2f6fb" stroke="#bacbdc" stroke-width="2"/><text x="62" y="495" font-size="26" font-weight="700">Within-model feature evidence</text><text x="62" y="535" font-size="22" >Permutation importance ∩ recursive elimination</text><text x="62" y="569" font-size="22" >Intersect with coefficient-based selections</text><rect x="750" y="455" width="610" height="150" rx="12" fill="#f2f6fb" stroke="#bacbdc" stroke-width="2"/><text x="772" y="495" font-size="26" font-weight="700">Within-model feature evidence</text><text x="772" y="535" font-size="22" >Permutation importance ∩ recursive elimination</text><text x="772" y="569" font-size="22" >Intersect with coefficient-based selections</text><path d="M345 605V650H700V690" stroke="#456c99" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1055 605V650H700V690" stroke="#456c99" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="350" y="690" width="700" height="130" rx="12" fill="#edf7f5" stroke="#bacbdc" stroke-width="2"/><text x="372" y="730" font-size="26" font-weight="700">Consensus for each phenotype</text><text x="372" y="770" font-size="22" >Keep genes supported by a majority of qualifying models</text><text x="40" y="870" font-size="22" >Original explanatory diagram; not a reconstruction of the score distributions in publication Figures 1 and 2.</text></g></svg>