<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="750" viewBox="0 0 1440 750" role="img" aria-labelledby="title"><title id="title">Retinal inference study workflow</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#456c99"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#182735"><text x="40" y="58" font-size="34" font-weight="700">Retinal inference: from expression to biological hypotheses</text><text x="40" y="100" font-size="23" >Original schematic of the published study workflow · Casaletto et al., npj Microgravity (2026)</text><rect x="40" y="155" width="370" height="190" rx="12" fill="#f2f6fb" stroke="#bacbdc" stroke-width="2"/><text x="62" y="195" font-size="26" font-weight="700">RNA-sequencing profiles</text><text x="62" y="235" font-size="22" >RR-9 retinal tissue</text><text x="62" y="269" font-size="22" >16 mice; flight and ground</text><text x="62" y="303" font-size="22" >STAR / RSEM processed views</text><rect x="40" y="410" width="370" height="180" rx="12" fill="#fbf5eb" stroke="#bacbdc" stroke-width="2"/><text x="62" y="450" font-size="26" font-weight="700">Quantitative phenotypes</text><text x="62" y="490" font-size="22" >4-HNE: oxidative-damage signal</text><text x="62" y="524" font-size="22" >TUNEL: DNA-fragmentation signal</text><text x="62" y="558" font-size="22" >Separate regression targets</text><rect x="490" y="155" width="400" height="190" rx="12" fill="#f2f6fb" stroke="#bacbdc" stroke-width="2"/><text x="512" y="195" font-size="26" font-weight="700">Prepare expression features</text><text x="512" y="235" font-size="22" >Missingness / abundance filtering</text><text x="512" y="269" font-size="22" >Protein-coding + target correlation</text><text x="512" y="303" font-size="22" >1,000 genes; TPM and z-scores</text><rect x="490" y="410" width="400" height="180" rx="12" fill="#f2f6fb" stroke="#bacbdc" stroke-width="2"/><text x="512" y="450" font-size="26" font-weight="700">Train five regression models</text><text x="512" y="490" font-size="22" >Linear · Ridge · Lasso</text><text x="512" y="524" font-size="22" >Elastic Net · Support Vector</text><text x="512" y="558" font-size="22" >Training CV and held-out evaluation</text><rect x="970" y="155" width="430" height="190" rx="12" fill="#f2f6fb" stroke="#bacbdc" stroke-width="2"/><text x="992" y="195" font-size="26" font-weight="700">Build consensus gene sets</text><text x="992" y="235" font-size="22" >Qualify models by held-out R² ≥ 0.90</text><text x="992" y="269" font-size="22" >Combine feature-selection criteria</text><text x="992" y="303" font-size="22" >Majority agreement across models</text><rect x="970" y="410" width="430" height="180" rx="12" fill="#edf7f5" stroke="#bacbdc" stroke-width="2"/><text x="992" y="450" font-size="26" font-weight="700">Interpret biological associations</text><text x="992" y="490" font-size="22" >Gene-set / pathway enrichment</text><text x="992" y="524" font-size="22" >Compare the two phenotype signatures</text><text x="992" y="558" font-size="22" >Prioritize experimental follow-up</text><path d="M410 250H490" stroke="#456c99" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M690 345V410" stroke="#456c99" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M410 500H490" stroke="#456c99" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M890 500H930V250H970" stroke="#456c99" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1185 345V410" stroke="#456c99" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="40" y="660" font-size="23" >Processed views do not create additional animals. Predictive associations require independent validation.</text><text x="40" y="704" font-size="21" >This schematic summarizes the methods; it is not a reproduced experimental result or the publication’s original Figure 3.</text></g></svg>